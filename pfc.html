
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PFC</title>
<style>
  :root{
    --ink:#1a1a1a;
    --paper:#faf9f6;
    --rule:#1a1a1a;
    --protein:#b5262c;
    --protein-tint:#f6dcdd;
    --fat:#bd8a1e;
    --fat-tint:#f5ead0;
    --carbs:#1f6f9c;
    --carbs-tint:#d8e9f1;
    --fiber:#4a8f7c;
    --good:#2f7d4f;
    --good-tint:#e2f2e7;
    --warn:#bd8a1e;
    --warn-tint:#f5ead0;
    --bad:#b5262c;
    --bad-tint:#f6dcdd;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    padding:32px 16px 64px;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(26,26,26,0.05) 1px, transparent 0);
    background-size:22px 22px;
    color:var(--ink);
    font-family:"Helvetica Neue", Arial, sans-serif;
    display:flex;
    justify-content:center;
  }

  .label{
    width:100%;
    max-width:420px;
    background:#fff;
    border:3px solid var(--rule);
    padding:0;
  }

  .masthead{
    padding:18px 20px 10px;
    border-bottom:10px solid var(--rule);
  }
  .masthead .eyebrow{
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    font-weight:700;
    color:#5a5a5a;
  }
  .masthead h1{
    margin:2px 0 0;
    font-size:44px;
    font-weight:800;
    letter-spacing:-0.01em;
    font-stretch:condensed;
    line-height:1;
  }
  .masthead .sub{
    margin-top:6px;
    font-size:13px;
    color:#5a5a5a;
  }

  .rows{
    padding:0 20px;
  }

  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid #cfcfcf;
    gap:12px;
  }
  .row.thick{
    border-bottom:6px solid var(--rule);
  }
  .row.sub-row{
    padding-left:18px;
  }
  .row.sub-row .swatch{ opacity:0.55; }

  .row-label{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
    font-size:17px;
  }
  .row.sub-row .row-label{
    font-weight:500;
    font-size:14px;
  }

  .swatch{
    width:14px;
    height:14px;
    border-radius:3px;
    flex:none;
    border:1px solid rgba(0,0,0,0.2);
  }
  .swatch.protein{background:var(--protein);}
  .swatch.fat{background:var(--fat);}
  .swatch.carbs{background:var(--carbs);}
  .swatch.fiber{background:var(--fiber);}

  .amount{
    display:flex;
    align-items:baseline;
    gap:4px;
  }

  input[type="number"]{
    width:92px;
    text-align:right;
    font-family:"SFMono-Regular", Consolas, "Roboto Mono", monospace;
    font-size:18px;
    font-weight:700;
    padding:4px 6px;
    border:1.5px solid #b8b8b8;
    border-radius:4px;
    background:#fbfbfa;
    color:var(--ink);
  }
  input[type="number"]:focus{
    outline:2px solid var(--ink);
    outline-offset:1px;
    border-color:var(--ink);
  }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button{
    opacity:0.5;
  }
  .unit{
    font-size:12px;
    color:#6a6a6a;
    font-weight:600;
    width:14px;
  }

  .toggle-row{
    padding:14px 20px;
    border-bottom:6px solid var(--rule);
  }
  button#toggleButton{
    width:100%;
    padding:10px 14px;
    background:#fff;
    color:var(--ink);
    border:1.5px solid var(--ink);
    border-radius:5px;
    font-size:13px;
    font-weight:700;
    letter-spacing:0.03em;
    text-transform:uppercase;
    cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease;
  }
  button#toggleButton:hover{
    background:var(--ink);
    color:#fff;
  }
  button#toggleButton:focus-visible{
    outline:3px solid var(--carbs);
    outline-offset:2px;
  }

  .chart-section{
    padding:22px 20px 8px;
    display:flex;
    align-items:center;
    gap:18px;
  }
  #piechart{
    flex:none;
    display:block;
  }

  .legend{
    display:flex;
    flex-direction:column;
    gap:10px;
    flex:1;
    min-width:0;
  }
  .legend-item{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
  }
  .legend-item .legend-label{
    flex:1;
    font-weight:600;
    color:#3a3a3a;
  }
  .legend-item .legend-value{
    font-family:"SFMono-Regular", Consolas, "Roboto Mono", monospace;
    font-weight:700;
    font-size:14px;
  }

  .status-bar{
    margin:18px 20px 20px;
    border-radius:6px;
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:12px;
    border:1.5px solid transparent;
    transition:background 0.2s ease, border-color 0.2s ease;
  }
  .status-bar .dot{
    width:10px;
    height:10px;
    border-radius:50%;
    flex:none;
  }
  .status-bar .status-text{
    font-size:13px;
    line-height:1.4;
  }
  .status-bar .status-text b{
    display:block;
    font-size:14px;
    letter-spacing:0.02em;
  }

  .status-bar.good{ background:var(--good-tint); border-color:var(--good); }
  .status-bar.good .dot{ background:var(--good); }
  .status-bar.warn{ background:var(--warn-tint); border-color:var(--warn); }
  .status-bar.warn .dot{ background:var(--warn); }
  .status-bar.bad{ background:var(--bad-tint); border-color:var(--bad); }
  .status-bar.bad .dot{ background:var(--bad); }

  .footnote{
    padding:0 20px 18px;
    font-size:10.5px;
    color:#8a8a8a;
    line-height:1.5;
    border-top:1px solid #cfcfcf;
    padding-top:10px;
  }

  @media (max-width:400px){
    .masthead h1{font-size:36px;}
    .chart-section{flex-direction:column; align-items:stretch;}
    .legend{flex-direction:row; flex-wrap:wrap;}
  }

  @media (prefers-reduced-motion: reduce){
    * { transition:none !important; }
  }
</style>
</head>
<body>

<div class="label">

  <div class="masthead">
    <div class="eyebrow">Protein, Fat, Carbohydrates</div>
    <h1>PFC</h1>
    <div class="sub">Enter grams of macro-nutrients below to see calorie split.</div>
  </div>

  <div class="rows">

    <div class="row thick">
      <div class="row-label"><span class="swatch fat"></span>Fat</div>
      <div class="amount"><input type="number" id="fat" value="0" min="0" inputmode="decimal"><span class="unit">g</span></div>
    </div>

    <div class="row">
      <div class="row-label"><span class="swatch carbs"></span>Carbs</div>
      <div class="amount"><input type="number" id="carbs" value="0" min="0" inputmode="decimal"><span class="unit">g</span></div>
    </div>

    <div class="row sub-row thick">
      <div class="row-label"><span class="swatch fiber"></span>Fiber</div>
      <div class="amount"><input type="number" id="fiber" value="0" min="0" inputmode="decimal"><span class="unit">g</span></div>
    </div>
    <div class="row">
      <div class="row-label"><span class="swatch protein"></span>Protein</div>
      <div class="amount"><input type="number" id="protein" value="0" min="0" inputmode="decimal"><span class="unit">g</span></div>
    </div>
  </div>

  <div class="toggle-row">
    <button id="toggleButton" type="button">Show Net Carbs</button>
  </div>

  <div class="chart-section">
    <canvas id="piechart" width="176" height="176"></canvas>
    <div class="legend" id="legend"></div>
  </div>

  <div class="status-bar good" id="statusBar">
    <div class="dot"></div>
    <div class="status-text" id="statusText"><b>—</b>Enter values to check the carb guideline.</div>
  </div>

  <div class="footnote">Guideline check compares the carb share of total calories against a 25% reference line.</div>

</div>

<script>
    const fatInput = document.getElementById('fat');
    const carbsInput = document.getElementById('carbs');
    const fiberInput = document.getElementById('fiber');
    const proteinInput = document.getElementById('protein');
    const piechartCanvas = document.getElementById('piechart');
    const toggleButton = document.getElementById('toggleButton');
    const legend = document.getElementById('legend');
    const statusBar = document.getElementById('statusBar');
    const statusText = document.getElementById('statusText');

    let isNetCarbs = false;

    const COLORS = { protein: '#b5262c', fat: '#bd8a1e', carbs: '#1f6f9c' };

    function readValue(input) {
        var n = parseFloat(input.value);
        return isNaN(n) ? 0.0 : n;
    }

    function calculateMacros() {
        var fat = readValue(fatInput);
        var carbs = readValue(carbsInput);
        var fiber = readValue(fiberInput);
        var protein = readValue(proteinInput);
        if (fiber > carbs) fiber = carbs;

        const effectiveCarbs = (isNetCarbs) ? carbs - fiber : carbs;
        const totalCalories = (fat * 9) + effectiveCarbs * 4 + (protein * 4);
        const fatPercent = ((totalCalories==0) ? 0.0 : (fat * 9 / totalCalories) * 100);
        const carbsPercent = ((totalCalories==0) ? 0.0 : effectiveCarbs * 4 / totalCalories * 100);
        const proteinPercent = ((totalCalories==0) ? 0.0 : (protein * 4 / totalCalories) * 100);

        return { fatPercent, carbsPercent, proteinPercent, totalCalories };
    }

    function drawDonut(data, colors) {
        const ctx = piechartCanvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        const size = 176;
        piechartCanvas.width = size * dpr;
        piechartCanvas.height = size * dpr;
        piechartCanvas.style.width = size + 'px';
        piechartCanvas.style.height = size + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, size, size);

        const isEmpty = data.every(d => d === 0);
        const slices = isEmpty ? data.map(() => 100/data.length) : data;

        const x = size/2, y = size/2, r = size/2 - 4;
        let startAngle = -Math.PI/2;
        for (let i = 0; i < slices.length; i++) {
            const arcangle = Math.PI * 2 * (slices[i] / 100);
            ctx.beginPath();
            ctx.moveTo(x + Math.cos(startAngle) * r*0.55, y + Math.sin(startAngle) * r*0.55);
            ctx.lineTo(x + Math.cos(startAngle) * r, y + Math.sin(startAngle) * r);
            ctx.arc(x, y, r, startAngle, startAngle + arcangle);
            ctx.lineTo(x + Math.cos(startAngle+arcangle) * r*0.55, y + Math.sin(startAngle+arcangle) * r*0.55);
            ctx.arc(x, y, r*0.55, startAngle + arcangle, startAngle, true);
            ctx.closePath();
            ctx.fillStyle = isEmpty ? '#e3e3e0' : colors[i];
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.stroke();
            startAngle += arcangle;
        }

        // center label
        ctx.fillStyle = '#1a1a1a';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        if (isEmpty) {
            ctx.font = '600 12px Helvetica, Arial, sans-serif';
            ctx.fillStyle = '#8a8a8a';
            ctx.fillText('', x, y);
        } else {
            ctx.font = '800 20px Helvetica, Arial, sans-serif';
            ctx.fillText(Math.round(data[2]) + '%', x, y - 9);
            ctx.font = '600 10px Helvetica, Arial, sans-serif';
            ctx.fillStyle = '#6a6a6a';
            ctx.fillText((isNetCarbs ? 'NET CARBS' : 'CARBS'), x, y + 9);
        }
    }

    function renderLegend(proteinPercent, fatPercent, carbsPercent) {
        const carbLabel = isNetCarbs ? 'Net carbs' : 'Carbs';
        legend.innerHTML = `
          <div class="legend-item">
            <span class="swatch protein"></span>
            <span class="legend-label">Protein</span>
            <span class="legend-value">${proteinPercent.toFixed(1)}%</span>
          </div>
          <div class="legend-item">
            <span class="swatch fat"></span>
            <span class="legend-label">Fat</span>
            <span class="legend-value">${fatPercent.toFixed(1)}%</span>
          </div>
          <div class="legend-item">
            <span class="swatch carbs"></span>
            <span class="legend-label">${carbLabel}</span>
            <span class="legend-value">${carbsPercent.toFixed(1)}%</span>
          </div>
        `;
    }

    function renderStatus(carbsPercent, totalCalories) {
        statusBar.classList.remove('good','warn','bad');
        if (totalCalories === 0) {
            statusBar.classList.add('good');
            statusText.innerHTML = '<b>—</b>Enter values to check the carb guideline.';
            return;
        }
        let cls, headline, detail;
        if (carbsPercent > 25 + 10) {
            cls = 'bad';
            headline = 'Outside guideline';
            detail = `Carbs are ${carbsPercent.toFixed(1)}% of calories — more than 10 points over the 25% reference.`;
        } else if (carbsPercent > 25) {
            cls = 'warn';
            headline = 'Within 10% of guideline';
            detail = `Carbs are ${carbsPercent.toFixed(1)}% of calories — within 10 points of the 25% reference.`;
        } else {
            cls = 'good';
            headline = 'Within guideline';
            detail = `Carbs are ${carbsPercent.toFixed(1)}% of calories — at or below the 25% reference.`;
        }
        statusBar.classList.add(cls);
        statusText.innerHTML = `<b>${headline}</b>${detail}`;
    }

    function updateChart() {
        const m = calculateMacros();
        drawDonut([m.proteinPercent, m.fatPercent, m.carbsPercent], [COLORS.protein, COLORS.fat, COLORS.carbs]);
        renderLegend(m.proteinPercent, m.fatPercent, m.carbsPercent);
        renderStatus(m.carbsPercent, m.totalCalories);
    }

    function sanitizeInput(input) {
        // Only rewrite the field's text on blur, so a mid-typed value like
        // "12." or an empty box isn't clobbered while the person is still typing.
        input.value = readValue(input);
    }

    updateChart();

    [fatInput, carbsInput, fiberInput, proteinInput].forEach(inp => {
        inp.addEventListener('input', updateChart);
        inp.addEventListener('change', function() {
            sanitizeInput(this);
            updateChart();
        });
    });

    toggleButton.addEventListener('click', function() {
        isNetCarbs = !isNetCarbs;
        this.innerText = (isNetCarbs) ? 'Show Total Carbs' : 'Show Net Carbs';
        updateChart();
    });
</script>

</body>
</html>
